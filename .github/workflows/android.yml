name: Android

# Builds the real Android app: expo prebuild generates the native Gradle
# project, then Gradle compiles the six Kotlin modules under
# apps/mobile/modules/frosh-* and links them into a debug APK.
#
# This job exists because the Kotlin sources were never compiled anywhere.
# `bun run typecheck:mobile` only checks TypeScript; it cannot see a bad
# Kotlin escape sequence or a native method that does not exist.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Expo CLI prints a warning about telemetry/dotenv that we do not care about.
  EXPO_NO_TELEMETRY: '1'

jobs:
  assemble-debug:
    name: Prebuild and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Expo SDK 54 / React Native 0.81 require JDK 17. The ubuntu-latest
      # image already ships 17, but pinning it keeps the build reproducible.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # These are the versions ExpoRootProjectPlugin defaults to for SDK 54
      # (compileSdk 35, build-tools 35.0.0, NDK 27.1.12297006) plus the CMake
      # that AGP expects. The runner image usually has them already; pinning
      # them here means a runner image update cannot break the build.
      - name: Install the SDK packages this build needs
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1" > /dev/null

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cheap guard that runs before the slow native steps. Autolinking needs
      # BOTH expo-module.config.json and android/build.gradle in each module;
      # when either is missing the module is dropped silently and the app
      # still builds, but every native call fails at runtime with
      # "Cannot find native module 'Frosh...'".
      - name: Verify all six native modules are autolinked
        run: |
          set -euo pipefail
          npx expo-modules-autolinking resolve --platform android \
            | sed 's/\x1b\[[0-9;]*m//g' > /tmp/autolinking.txt
          cat /tmp/autolinking.txt

          missing=0
          for module in frosh-apps frosh-calls frosh-contacts \
                        frosh-media frosh-messaging frosh-notifications; do
            if grep -q "expo-$module" /tmp/autolinking.txt; then
              echo "autolinked: expo-$module"
            else
              echo "::error::expo-$module was not autolinked. Check modules/$module/expo-module.config.json and modules/$module/android/build.gradle."
              missing=1
            fi
          done
          exit "$missing"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Proves Gradle itself sees the six modules as real projects, and
      # surfaces any build.gradle error before the full compile starts.
      - name: Verify Gradle includes the six native projects
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          ./gradlew projects --no-daemon --console=plain | tee /tmp/projects.txt

          missing=0
          for module in frosh-apps frosh-calls frosh-contacts \
                        frosh-media frosh-messaging frosh-notifications; do
            if grep -q "expo-$module" /tmp/projects.txt; then
              echo "gradle project present: :expo-$module"
            else
              echo "::error::Gradle did not include project :expo-$module"
              missing=1
            fi
          done
          exit "$missing"

      # First run downloads Gradle 8.14.3, AGP, and the React Native
      # artifacts, so allow a generous timeout. Later runs hit the cache.
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: frosh-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
