name: Android

# Builds the real Android app: expo prebuild generates the native Gradle
# project, then Gradle compiles the six Kotlin modules under
# apps/mobile/modules/frosh-* and links them into a debug APK.
#
# This job exists because the Kotlin sources were never compiled anywhere.
# `bun run typecheck:mobile` only checks TypeScript; it cannot see a bad
# Kotlin escape sequence or a native method that does not exist.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Expo CLI prints a warning about telemetry/dotenv that we do not care about.
  EXPO_NO_TELEMETRY: '1'

jobs:
  assemble-debug:
    name: Prebuild and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Expo SDK 54 / React Native 0.81 require JDK 17. The ubuntu-latest
      # image already ships 17, but pinning it keeps the build reproducible.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Deliberately no android-actions/setup-android here. It failed as the
      # first step of the first run (its @v3 major is two releases behind and
      # ubuntu-latest started moving to Ubuntu 26 on 2026-10-19), and every
      # real step after it was skipped. This resolves an SDK without depending
      # on a third-party action: use the one baked into the runner image, and
      # only download command-line tools if the image has none.
      - name: Ensure an Android SDK is available
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
            echo "No SDK on the runner image; installing command-line tools into $SDK"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "Using Android SDK at $SDK"
          ls "$SDK/platforms" "$SDK/build-tools" "$SDK/ndk" 2>/dev/null || true

      # These are the versions ExpoRootProjectPlugin defaults to for SDK 54
      # (compileSdk 35, build-tools 35.0.0, NDK 27.1.12297006) plus the CMake
      # that AGP expects. Whatever is already installed is left alone; a
      # failure here is a warning, not a stop, because AGP downloads missing
      # components itself during configuration.
      - name: Install any missing SDK packages
        run: |
          set -uo pipefail
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKM" ]; then
            echo "::warning::sdkmanager not found; relying on packages already on the image"
            exit 0
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          for pkg in "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
                     "ndk;27.1.12297006" "cmake;3.22.1"; do
            if "$SDKM" --list_installed 2>/dev/null | grep -qF "$pkg"; then
              echo "already installed: $pkg"
            else
              echo "installing: $pkg"
              "$SDKM" --install "$pkg" > /dev/null 2>&1 \
                || echo "::warning::could not install $pkg; the build will try to fetch it"
            fi
          done

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cheap guard that runs before the slow native steps. Autolinking needs
      # BOTH expo-module.config.json and android/build.gradle in each module;
      # when either is missing the module is dropped silently and the app
      # still builds, but every native call fails at runtime with
      # "Cannot find native module 'Frosh...'".
      - name: Verify all six native modules are autolinked
        run: |
          set -euo pipefail
          npx expo-modules-autolinking resolve --platform android \
            | sed 's/\x1b\[[0-9;]*m//g' > /tmp/autolinking.txt
          cat /tmp/autolinking.txt

          missing=0
          for module in frosh-apps frosh-calls frosh-contacts \
                        frosh-media frosh-messaging frosh-notifications; do
            if grep -q "expo-$module" /tmp/autolinking.txt; then
              echo "autolinked: expo-$module"
            else
              echo "::error::expo-$module was not autolinked. Check modules/$module/expo-module.config.json and modules/$module/android/build.gradle."
              missing=1
            fi
          done
          exit "$missing"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Proves Gradle itself sees the six modules as real projects, and
      # surfaces any build.gradle error before the full compile starts.
      - name: Verify Gradle includes the six native projects
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          ./gradlew projects --no-daemon --console=plain | tee /tmp/projects.txt

          missing=0
          for module in frosh-apps frosh-calls frosh-contacts \
                        frosh-media frosh-messaging frosh-notifications; do
            if grep -q "expo-$module" /tmp/projects.txt; then
              echo "gradle project present: :expo-$module"
            else
              echo "::error::Gradle did not include project :expo-$module"
              missing=1
            fi
          done
          exit "$missing"

      # First run downloads Gradle 8.14.3, AGP, and the React Native
      # artifacts, so allow a generous timeout. Later runs hit the cache.
      # One step deliberately. The job sets defaults.run.working-directory to
      # apps/mobile, and an earlier split version of this looked for the log
      # relative to the wrong directory, so a red run only ever said "Gradle
      # wrote no log". Keeping capture, annotation, and exit in one place makes
      # the path unambiguous: $RUNNER_TEMP is not affected by working-directory.
      - name: Assemble debug APK
        id: build
        working-directory: apps/mobile/android
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/gradle-build.log"

          if ./gradlew assembleDebug --no-daemon --console=plain --stacktrace \
               -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" 2>&1 | tee "$LOG"; then
            exit 0
          fi

          # Gradle's own log endpoint needs repository admin, so turn the useful
          # lines into an annotation that the public checks API can read.
          EXCERPT="$(
            { grep -E '^e: |What went wrong|FAILURE: Build failed|Execution failed for task|> Task .* FAILED|^Caused by' "$LOG" || true; } \
              | head -40 | cut -c1-300
          )"
          if [ -z "$EXCERPT" ]; then
            EXCERPT="$(tail -40 "$LOG" | cut -c1-300)"
          fi
          MSG=${EXCERPT//'%'/'%25'}
          MSG=${MSG//$'\n'/'%0A'}
          MSG=${MSG//$'\r'/'%0D'}
          printf '::error title=Gradle build failed::%s\n' "$MSG"

          {
            echo '### Gradle failure'
            echo
            echo '```'
            tail -150 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: frosh-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
